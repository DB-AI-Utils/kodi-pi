services:
  go2rtc:
    image: alexxit/go2rtc
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped

  kodi-pi:
    build: .
    network_mode: host
    volumes:
      - ./recordings:/app/recordings
    env_file:
      - .env
    depends_on:
      - go2rtc
    restart: unless-stopped
